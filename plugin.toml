# RuneLite Recorder - records only the RuneLite (Old School RuneScape) client window
# with gpu-screen-recorder, with the replay buffer as the main feature.
#
# The headless [[service]] owns session discovery and the gpu-screen-recorder
# process for the whole session. UI entries are thin clients that mirror the
# service's "status" and drive it through the "command" channel.
#
# Settings are plugin-level ([[setting]] at the root), shared by every entry.

id = "fredrikj/runelite-recorder"
name = "RuneLite Recorder"
version = "0.1.0"
plugin_api = 43
author = "fredrikj"
license = "MIT"
dependencies = ["gpu-screen-recorder", "hyprctl"]
tags = ["recording", "video", "gaming", "hyprland"]
icon = "video"
description = "Replay buffer and recording of the RuneLite window with gpu-screen-recorder (Hyprland)."

# ── Start and sessions ───────────────────────────────────────────────────────

[[setting]]
key = "start_mode"
type = "select"
label_key = "settings.start_mode.label"
description_key = "settings.start_mode.description"
default = "auto"
options = [
  { value = "auto", label_key = "settings.start_mode.options.auto" },
  { value = "manual", label_key = "settings.start_mode.options.manual" },
]

[[setting]]
key = "auto_session"
type = "select"
label_key = "settings.auto_session.label"
description_key = "settings.auto_session.description"
default = "last_character"
options = [
  { value = "last_character", label_key = "settings.auto_session.options.last_character" },
  { value = "focused", label_key = "settings.auto_session.options.focused" },
  { value = "first", label_key = "settings.auto_session.options.first" },
]

[[setting]]
key = "follow_next_session"
type = "bool"
label_key = "settings.follow_next_session.label"
description_key = "settings.follow_next_session.description"
default = true

[[setting]]
key = "stop_grace"
type = "int"
label_key = "settings.stop_grace.label"
description_key = "settings.stop_grace.description"
default = 5
min = 0
max = 120

# ── Output ───────────────────────────────────────────────────────────────────

[[setting]]
key = "directory"
type = "folder"
label_key = "settings.directory.label"
description_key = "settings.directory.description"
default = "~/Videos/RuneLite"

[[setting]]
key = "filename_pattern"
type = "string"
label_key = "settings.filename_pattern.label"
description_key = "settings.filename_pattern.description"
default = "runelite_{character}_%Y%m%d_%H%M%S"

[[setting]]
key = "replay_filename_pattern"
type = "string"
label_key = "settings.replay_filename_pattern.label"
description_key = "settings.replay_filename_pattern.description"
default = "replay_{character}_%Y%m%d_%H%M%S"

[[setting]]
key = "per_character_folder"
type = "bool"
label_key = "settings.per_character_folder.label"
description_key = "settings.per_character_folder.description"
default = false

[[setting]]
key = "post_save_script"
type = "file"
label_key = "settings.post_save_script.label"
description_key = "settings.post_save_script.description"
default = ""

[[setting]]
key = "copy_to_clipboard"
type = "bool"
label_key = "settings.copy_to_clipboard.label"
default = false

# ── Replay buffer ────────────────────────────────────────────────────────────

[[setting]]
key = "replay_duration"
type = "int"
label_key = "settings.replay_duration.label"
default = 30
min = 5
max = 3600

[[setting]]
key = "replay_storage"
type = "select"
label_key = "settings.replay_storage.label"
default = "ram"
options = [
  { value = "ram", label_key = "settings.replay_storage.options.ram" },
  { value = "disk", label_key = "settings.replay_storage.options.disk" },
]

# ── Video ────────────────────────────────────────────────────────────────────

[[setting]]
key = "frame_rate"
type = "int"
label_key = "settings.frame_rate.label"
default = 60
min = 1
max = 240

[[setting]]
key = "frame_rate_mode"
type = "select"
label_key = "settings.frame_rate_mode.label"
default = "vfr"
options = [
  { value = "vfr", label_key = "settings.frame_rate_mode.options.vfr" },
  { value = "cfr", label_key = "settings.frame_rate_mode.options.cfr" },
]

[[setting]]
key = "video_codec"
type = "select"
label_key = "settings.video_codec.label"
default = "h264"
options = [
  { value = "h264", label_key = "settings.video_codec.options.h264" },
  { value = "hevc", label_key = "settings.video_codec.options.hevc" },
  { value = "av1", label_key = "settings.video_codec.options.av1" },
  { value = "vp8", label_key = "settings.video_codec.options.vp8" },
  { value = "vp9", label_key = "settings.video_codec.options.vp9" },
]

[[setting]]
key = "video_encoder"
type = "select"
label_key = "settings.video_encoder.label"
description_key = "settings.video_encoder.description"
default = "gpu"
options = [
  { value = "gpu", label_key = "settings.video_encoder.options.gpu" },
  { value = "cpu", label_key = "settings.video_encoder.options.cpu" },
]

[[setting]]
key = "video_bitrate_mode"
type = "select"
label_key = "settings.video_bitrate_mode.label"
default = "qp"
options = [
  { value = "qp", label_key = "settings.video_bitrate_mode.options.qp" },
  { value = "vbr", label_key = "settings.video_bitrate_mode.options.vbr" },
  { value = "cbr", label_key = "settings.video_bitrate_mode.options.cbr" },
]

[[setting]]
key = "video_qp"
type = "int"
label_key = "settings.video_qp.label"
description_key = "settings.video_qp.description"
default = 25
min = 0
max = 51
visible_when = { key = "video_bitrate_mode", values = ["qp"] }

[[setting]]
key = "video_quality"
type = "select"
label_key = "settings.video_quality.label"
default = "very_high"
options = [
  { value = "medium", label_key = "settings.video_quality.options.medium" },
  { value = "high", label_key = "settings.video_quality.options.high" },
  { value = "very_high", label_key = "settings.video_quality.options.very_high" },
  { value = "ultra", label_key = "settings.video_quality.options.ultra" },
]
visible_when = { key = "video_bitrate_mode", values = ["vbr"] }

[[setting]]
key = "video_bitrate"
type = "string"
label_key = "settings.video_bitrate.label"
description_key = "settings.video_bitrate.description"
default = "20000"
visible_when = { key = "video_bitrate_mode", values = ["cbr"] }

[[setting]]
key = "resolution"
type = "string"
label_key = "settings.resolution.label"
description_key = "settings.resolution.description"
default = "original"

[[setting]]
key = "show_cursor"
type = "bool"
label_key = "settings.show_cursor.label"
default = true

[[setting]]
key = "color_range"
type = "select"
label_key = "settings.color_range.label"
default = "limited"
options = [
  { value = "limited", label_key = "settings.color_range.options.limited" },
  { value = "full", label_key = "settings.color_range.options.full" },
]

# ── Audio ────────────────────────────────────────────────────────────────────

[[setting]]
key = "audio_source"
type = "select"
label_key = "settings.audio_source.label"
default = "runelite"
options = [
  { value = "runelite", label_key = "settings.audio_source.options.runelite" },
  { value = "runelite_mic", label_key = "settings.audio_source.options.runelite_mic" },
  { value = "default_output", label_key = "settings.audio_source.options.default_output" },
  { value = "default_input", label_key = "settings.audio_source.options.default_input" },
  { value = "both", label_key = "settings.audio_source.options.both" },
  { value = "custom", label_key = "settings.audio_source.options.custom" },
  { value = "none", label_key = "settings.audio_source.options.none" },
]

[[setting]]
key = "runelite_audio_app"
type = "string"
label_key = "settings.runelite_audio_app.label"
description_key = "settings.runelite_audio_app.description"
default = ""
visible_when = { key = "audio_source", values = ["runelite", "runelite_mic"] }

[[setting]]
key = "custom_audio_sources"
type = "string"
label_key = "settings.custom_audio_sources.label"
description_key = "settings.custom_audio_sources.description"
default = ""
visible_when = { key = "audio_source", values = ["custom"] }

[[setting]]
key = "audio_codec"
type = "select"
label_key = "settings.audio_codec.label"
default = "opus"
options = [
  { value = "opus", label_key = "settings.audio_codec.options.opus" },
  { value = "aac", label_key = "settings.audio_codec.options.aac" },
  { value = "flac", label_key = "settings.audio_codec.options.flac" },
]
visible_when = { key = "audio_source", values = ["runelite", "runelite_mic", "default_output", "default_input", "both", "custom"] }

[[setting]]
key = "audio_bitrate"
type = "int"
label_key = "settings.audio_bitrate.label"
description_key = "settings.audio_bitrate.description"
default = 0
min = 0
max = 512
visible_when = { key = "audio_source", values = ["runelite", "runelite_mic", "default_output", "default_input", "both", "custom"] }

# ── Window resize ────────────────────────────────────────────────────────────

[[setting]]
key = "on_resize"
type = "select"
label_key = "settings.on_resize.label"
description_key = "settings.on_resize.description"
default = "restart"
options = [
  { value = "restart", label_key = "settings.on_resize.options.restart" },
  { value = "stop", label_key = "settings.on_resize.options.stop" },
]

[[setting]]
key = "resize_settle"
type = "int"
label_key = "settings.resize_settle.label"
description_key = "settings.resize_settle.description"
default = 3
min = 1
max = 30
visible_when = { key = "on_resize", values = ["restart"] }

# ── Session discovery ────────────────────────────────────────────────────────

[[setting]]
key = "window_class"
type = "string"
label_key = "settings.window_class.label"
description_key = "settings.window_class.description"
default = "^net-runelite-client-RuneLite$"
advanced = true

[[setting]]
key = "exclude_title"
type = "string"
label_key = "settings.exclude_title.label"
description_key = "settings.exclude_title.description"
default = "^(RuneLite Launcher|win[0-9]+)$"
advanced = true

# Headless background service: discovers RuneLite sessions and owns the
# gpu-screen-recorder process.
[[service]]
id = "service"
entry = "service.luau"

# Session picker. Lists RuneLite sessions; clicking one moves the capture there.
# Opened by the bar widget, or: noctalia msg panel-toggle fredrikj/runelite-recorder:sessions
[[panel]]
id = "sessions"
entry = "panel.luau"
width = 380
height = 360
placement = "attached"
position = "auto"
open_near_click = true
